services:
  # 1. Container PHP (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: geoportal-app
    container_name: geoportal-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    networks:
      - geoportal-network
    depends_on:
      - db

  # 2. Container Nginx (Web Server)
  web:
    image: nginx:alpine
    container_name: geoportal-web
    restart: unless-stopped
    ports:
      - "8080:80" # Akses via http://localhost:8080
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - geoportal-network
    depends_on:
      - app

  # 3. Container Database (PostgreSQL + PostGIS)
  db:
    image: postgis/postgis:15-3.3
    container_name: geoportal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoportal_aceh
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rahasia123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - geoportal-network

  # 4. Container Node.js (Opsional: Untuk build React nanti)
  node:
    image: node:20-alpine
    container_name: geoportal-node
    working_dir: /var/www/html
    volumes:
      - ./frontend:/var/www/html
    networks:
      - geoportal-network
    tty: true
    ports:
      - "5173:5173" # Port default Vite React

networks:
  geoportal-network:
    driver: bridge

volumes:
  pgdata: